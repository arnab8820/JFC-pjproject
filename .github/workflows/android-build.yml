name: CI Android
on:
  push:
    branches:
      - 'v2.15.1'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-android:
    name: Build Android (NDK)
    runs-on: ubuntu-latest

    steps:
      - name: 🔁 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Install Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Export Android paths
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: 🧱 Make build scripts executable
        run: |
          chmod +x configure-android
          chmod +x build/build* || true

      - name: 📐 Configure for Android
        run: |
          ./configure-android --use-ndk=$ANDROID_NDK_ROOT --with-samples=no

      - name: 🏗️ Build Native
        run: |
          make dep && make clean && make
        env:
          NDK_ROOT: $ANDROID_NDK_ROOT

      - name: 📁 List Native Outputs
        run: find . -name "*.so" -o -name "*.a"

      - name: 📦 Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: android-native-libs
          path: |
            **/*.so
            **/*.a