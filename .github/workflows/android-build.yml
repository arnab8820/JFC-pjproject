name: CI Android
on:
  push:
    branches:
      - 'v2.15.1'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-android:
    name: Build Android (NDK)
    runs-on: ubuntu-latest

    steps:
      - name: 🔁 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Install Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android tools to PATH
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install Android NDK
        run: |
          yes | sdkmanager "ndk;25.2.9519653"

      - name: Export Android paths
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: 🧱 Make build scripts executable
        run: |
          chmod +x configure-android
          chmod +x build/build* || true

      - name: Configure for Android
        run: |
          export APP_PLATFORM=android-26
          export TARGET_ABI=arm64-v8a
          ./configure-android --with-samples=no

      - name: Build native libraries
        run: |
          make dep
          make clean
          make -j$(nproc)

      - name: 📁 List Native Outputs
        run: find . -name "*.so" -o -name "*.a"

      - name: 📦 Upload Android static libraries
        uses: actions/upload-artifact@v4
        with:
          name: pjsip-android-arm64-api26
          path: |
            pjlib/build/output/**/libpj.a
            pjlib-util/build/output/**/libpjlib-util.a
            pjmedia/build/output/**/libpjmedia*.a
            pjnath/build/output/**/libpjnath.a
            pjsip/build/output/**/libpjsip*.a